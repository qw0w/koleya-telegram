name: Optimize ambient renderer

on:
  push:
    paths:
      - '.github/workflows/optimize-ambient.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply ambient optimizations
        run: python3 .github/scripts/optimize_ambient.py

      - name: Validate embedded JavaScript
        run: python3 -c 'from pathlib import Path; import re; s=Path("index.html").read_text(encoding="utf-8"); b=re.findall(r"<script(?:\\s[^>]*)?>(.*?)</script>",s,re.S|re.I); Path("/tmp/koleya-inline.js").write_text("\\n".join(b),encoding="utf-8")' && node --check /tmp/koleya-inline.js

      - name: Commit optimization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Optimize ambient renderer"
          git push
