name: Fix browser audio unlock

on:
  push:
    paths:
      - '.github/workflows/fix-audio.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch Web Audio unlock and combat SFX
        run: python3 .github/scripts/fix_audio.py

      - name: Validate embedded JavaScript syntax
        run: python3 -c 'from pathlib import Path; import re; s=Path("index.html").read_text(encoding="utf-8"); b=re.findall(r"<script(?:\\s[^>]*)?>(.*?)</script>",s,re.S|re.I); Path("/tmp/koleya-inline.js").write_text("\\n".join(b),encoding="utf-8")' && node --check /tmp/koleya-inline.js

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix Web Audio unlock and combat SFX"
          git push
