name: Inspect performance hotspots

on:
  push:
    paths:
      - '.github/workflows/inspect-perf.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show render loop and canvas setup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")
          needles=[
            "requestAnimationFrame",
            "devicePixelRatio",
            "canvas.width",
            "canvas.height",
            "shadowBlur",
            "globalCompositeOperation",
            "particles",
            "for(let i=",
            "performance.now",
            "function draw",
            "function render",
            "ctx.scale",
            "setTransform"
          ]
          for needle in needles:
              start=0
              shown=0
              while shown<8:
                  i=s.find(needle,start)
                  if i<0: break
                  print("\n###",needle,"at",i)
                  print(s[max(0,i-700):i+1800])
                  start=i+len(needle)
                  shown+=1
          PY
