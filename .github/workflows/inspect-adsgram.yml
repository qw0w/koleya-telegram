name: Inspect AdsGram integration

on:
  push:
    paths:
      - '.github/workflows/inspect-adsgram.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print AdsGram integration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")
          for needle in ["Adsgram.init", "rewardBlockId", "sdk.rewarded", "rewarded:", "adFail"]:
              start=0
              for n in range(8):
                  i=s.find(needle,start)
                  if i<0: break
                  print("\n###",needle,"@",i)
                  print(s[max(0,i-1000):i+3000])
                  start=i+len(needle)
          PY
