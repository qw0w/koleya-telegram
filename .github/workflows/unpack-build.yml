name: Unpack Telegram build

on:
  push:
    paths:
      - 'koleya-telegram-ready.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack build into repository root
        run: |
          rm -rf .koleya_unpack
          mkdir .koleya_unpack
          unzip -o koleya-telegram-ready.zip -d .koleya_unpack
          cp -a .koleya_unpack/koleya-telegram/. .
          rm -rf .koleya_unpack

      - name: Commit unpacked build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html telegram-config.js .nojekyll README_TELEGRAM.md fonts/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy Telegram game build"
            git push
          fi
